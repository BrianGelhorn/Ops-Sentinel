name: CI Ops Sentinel

on:
    push:
      branches: ['main', 'dev']
    pull_request:
    workflow_dispatch:
        
env:
    DB_PORT_TEST: 5434
    POSTGRES_DB_TEST: ops_sentinel_test
    POSTGRES_USER: opssentinel
    POSTGRES_PASSWORD: test_password
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        services:
            db_test:
                image: postgres:18
                ports:
                - 5434:5432
                env:
                    POSTGRES_DB: ops_sentinel_test
                    POSTGRES_USER: opssentinel
                    POSTGRES_PASSWORD: test_password
                options: >-
                    --health-cmd="pg_isready -U opssentinel -d ops_sentinel_test"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=5
                    --health-start-period=5s
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set Up Python
              uses: actions/setup-python@v6
              with:
                python-version: "3.13"

            - name: Install dependencies
              run: pip install -r requirements.txt pytest pytest-asyncio flake8

            - name: Lint with Flake8
              run: flake8 . --count --select=E,F63,F7,F82 --max-line-length=100

            - name: Run python tests
              run: python -m pytest
