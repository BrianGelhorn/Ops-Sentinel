name: Deploy and Test Ops Sentinel

on:
    push:
        branches: [dev]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set Up Python
              uses: actions/setup-python@v6
              with:
                python-version: 3.13

            - name: Install dependencies
              run: pip install -r requirements.txt pytest flake8

            - name: Lint with Flake8
              run: flake8 . --count --select=E,F63,F7,F82 --max-line-length=100

            - name: Run python tests
              run: python -m pytest
