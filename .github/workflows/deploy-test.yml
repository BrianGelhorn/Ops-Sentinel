name: Deploy Test Ops Sentinel

on:
  push:
    branches: ['dev']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:

      - name: Set image name in lowercase
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Log in to the Github Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Generate artifact attestation
        if: ${{ !env.ACT }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      
      - name: Connect to SSH server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USERNAME_TEST }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
          script: |
            if [ ! -d ./Ops-Sentinel/.git ]; then
              git clone https://github.com/${{ github.repository }}.git Ops-Sentinel
            fi
            cd "./Ops-Sentinel"
            git pull origin dev
            cat > .env << EOF
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_DB_TEST=${{ vars.POSTGRES_DB_TEST }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            APP_PORT=${{ vars.APP_PORT }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_PORT_TEST=${{ vars.DB_PORT_TEST }}
            EOF
            sudo docker pull ghcr.io/${{ env.IMAGE_NAME }}:dev
            sudo docker compose up -d

  test-api:
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      
      - name: Check if test API is ready
        run: |
          HEALTH_URL="http://${{ secrets.SSH_HOST_TEST }}:${{ vars.APP_PORT }}/health"
          READY_URL="http://${{ secrets.SSH_HOST_TEST }}:${{ vars.APP_PORT }}/ready"

          HEALTH_RESPONSE=$(curl -fsS "$HEALTH_URL" || true)
          HEALTH_STATUS=$(echo "$HEALTH_RESPONSE" | jq -r ".status // empty")
          if [ "$HEALTH_STATUS" = "alive" ]; then
            echo "Test API health check is alive"
          else
            echo "Test API health check did not report alive; continuing to readiness check"
          fi

          for attempt in {1..30}; do
            RESPONSE=$(curl -fsS "$READY_URL" || true)
            STATUS=$(echo "$RESPONSE" | jq -r ".status // empty")
            if [ "$STATUS" = "ready" ]; then
              echo "Test API is ready"
              exit 0
            fi

            echo "Test API is not ready yet (attempt $attempt/30)"
            sleep 5
          done

          echo "Test API did not become ready"
          exit 1
